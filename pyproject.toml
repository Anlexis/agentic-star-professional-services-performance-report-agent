[project]
name = "svc-c2-007"
version = "0.1.0"
description = "Professional Services Performance Report Generator — an AgentCore agent template"
requires-python = ">=3.11"
# The framework (agenticstar-agentcore) is installed from the platform's own
# package index rather than from public PyPI, so it is not listed here: pinning
# it would make `pip install -e .` fail against the default index. Install it
# alongside this package, as the deployment recipe in deploy/ does.
dependencies = [
    "agenticstar-agentcore[marketplace,openai]==1.0.3",
    "PyYAML==6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "types-PyYAML==6.0.12.20240311",
    "pytest-cov==5.0.0",
    "pytest-asyncio==1.4.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
]

[build-system]
requires = ["setuptools==68.0.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
# The walkthroughs under src/examples/ are reference material, not part of the
# agent; they are read, not type-checked.
exclude = ["src/examples/"]
# The published agenticstar-agentcore wheel ships no py.typed marker, so every
# framework.* / shared.* import resolves to Any — which makes each required
# framework subclass a "subclass of Any" error. All other strict settings stay on.
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = ["framework.*", "shared.*", "langgraph.*"]
ignore_missing_imports = true

# State extends the framework's AgentState TypedDict — correct at runtime, but
# the untyped wheel makes AgentState resolve to Any, so mypy cannot see the
# TypedDict base and mis-flags EVERY field. Silence only that diagnostic, only
# for this module; the individual field errors all share the one cause.
[[tool.mypy.overrides]]
module = ["src.schemas.state"]
disable_error_code = ["valid-type"]
